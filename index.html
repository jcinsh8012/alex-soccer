<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a1b2e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ALEX SOCCER" />
<meta property="og:title" content="ALEX SOCCER ⚽" />
<meta property="og:description" content="페널티킥 5번, 골키퍼를 뚫어라! 최고 득점에 도전하세요." />
<meta property="og:type" content="website" />
<title>⚽ ALEX SOCCER — 페널티킥</title>
<style>
  :root {
    --grass-1: #2e7d32;
    --grass-2: #43a047;
    --grass-dark: #1b5e20;
    --accent: #ffd23f;
    --accent-2: #ff6b35;
    --ink: #0d1b2a;
    --panel: rgba(13, 27, 42, 0.78);
    --good: #21d07a;
    --bad: #ff4d5e;
    --kit: #16d0a8;
    --kit-d: #0c8f72;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 600px at 50% -10%, #15375f 0%, #0a1b2e 55%, #050d18 100%);
  }

  /* ---------- Stage ---------- */
  #stage {
    position: relative;
    width: min(100vw, 480px);
    height: min(100vh, 860px);
    height: min(100dvh, 860px);
    background: #050d18;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  /* ---------- Stadium / Pitch ---------- */
  #pitch { position: absolute; inset: 0; }

  .sky {
    position: absolute; top: 0; left: 0; right: 0; height: 30%;
    background: linear-gradient(180deg, #0c2747 0%, #16406e 60%, #1d4f86 100%);
  }
  .crowd {
    position: absolute; top: 8%; left: 0; right: 0; height: 16%;
    background:
      repeating-linear-gradient(90deg, #1a2a44 0 6px, #223655 6px 12px),
      #1a2a44;
    opacity: 0.85;
    filter: brightness(0.9);
    box-shadow: inset 0 -20px 30px rgba(0,0,0,0.5);
  }
  .crowd::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1.4px);
    background-size: 9px 9px;
    opacity: 0.5;
  }
  .floodlight {
    position: absolute; top: 0; width: 50%; height: 55%;
    background: radial-gradient(ellipse at top, rgba(255,255,240,0.22), transparent 70%);
    pointer-events: none;
  }
  .floodlight.l { left: -10%; transform: skewX(-6deg); }
  .floodlight.r { right: -10%; transform: skewX(6deg); }

  .grass {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74%;
    background:
      repeating-linear-gradient(90deg,
        var(--grass-1) 0 14%, var(--grass-2) 14% 28%);
    transform-origin: center top;
    transform: perspective(420px) rotateX(38deg) scale(1.6);
    box-shadow: inset 0 60px 60px rgba(0,0,0,0.35);
  }
  .grass::before {
    content: ""; position: absolute; left: 8%; right: 8%; top: 6%; bottom: 0;
    border: 3px solid rgba(255,255,255,0.55);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .penalty-arc {
    position: absolute; left: 50%; top: 40%;
    width: 120px; height: 60px; transform: translateX(-50%);
    border: 3px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    clip-path: inset(0 0 50% 0);
  }

  /* ---------- Goal ---------- */
  #goalWrap {
    position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
    width: 80%; height: 29%;
    z-index: 5;
  }
  .net {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.32) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.32) 1px, transparent 1px);
    background-size: 11px 11px;
    background-color: rgba(20,40,70,0.30);
    border: 6px solid #f6f8ff;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), inset 0 0 30px rgba(0,0,0,0.35);
  }

  /* ---------- Goalkeeper (SVG) ---------- */
  #keeperLayer {
    position: absolute; left: 50%; bottom: -8px;
    width: 86px; height: 162px;
    transform: translateX(-50%);
    z-index: 6;
  }
  .gk-ground-shadow {
    position: absolute; left: 50%; bottom: 0; width: 66px; height: 14px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 72%);
    z-index: 0; transition: opacity .3s;
  }
  #keeper {
    position: absolute; inset: 0;
    transform-origin: 50% 88%;
    transition: transform .26s cubic-bezier(.34,1.4,.5,1);
    will-change: transform; z-index: 1;
  }
  #keeper svg { width: 100%; height: 100%; display: block; overflow: visible;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35)); }
  /* arms swing up to reach when diving to a side */
  #keeper .arm { transition: transform .26s ease; transform-box: fill-box; }
  #keeper.reach-l .arm-l { transform: rotate(-46deg); transform-origin: 90% 8%; }
  #keeper.reach-l .arm-r { transform: rotate(-30deg); transform-origin: 10% 8%; }
  #keeper.reach-r .arm-r { transform: rotate(46deg);  transform-origin: 10% 8%; }
  #keeper.reach-r .arm-l { transform: rotate(30deg);  transform-origin: 90% 8%; }
  #keeper.reach-up .arm-l { transform: rotate(-58deg); transform-origin: 90% 8%; }
  #keeper.reach-up .arm-r { transform: rotate(58deg);  transform-origin: 10% 8%; }

  /* ---------- Ball ---------- */
  #ball {
    position: absolute; left: 50%; bottom: 14%;
    width: 38px; height: 38px; transform: translate(-50%, 0);
    z-index: 8;
    will-change: transform, left, bottom;
  }
  .ball-skin {
    width: 100%; height: 100%; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, #fff 0%, #f0f0f0 40%, #c9ccd4 100%);
    box-shadow: 0 8px 14px rgba(0,0,0,0.4), inset -6px -6px 10px rgba(0,0,0,0.18);
    position: relative;
    overflow: hidden;
  }
  .ball-skin::before, .ball-skin::after {
    content: ""; position: absolute; background: #1b1b1f;
  }
  .ball-skin::before {
    width: 13px; height: 13px; left: 50%; top: 50%;
    transform: translate(-50%,-50%) ;
    clip-path: polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
  }
  .ball-skin::after {
    width: 7px; height: 7px; right: 4px; top: 6px; border-radius: 2px;
    transform: rotate(20deg);
  }
  #ballShadow {
    position: absolute; left: 50%; bottom: 12%;
    width: 40px; height: 12px; transform: translate(-50%, 0);
    background: radial-gradient(ellipse, rgba(0,0,0,0.45), transparent 70%);
    z-index: 7;
  }

  /* ---------- Aim UI ---------- */
  #aimZone {
    position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
    width: 80%; height: 29%; z-index: 9; pointer-events: none;
  }
  #reticle {
    position: absolute; width: 46px; height: 46px; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    border: 3px solid var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 16px var(--accent), inset 0 0 8px var(--accent);
    display: none;
  }
  #reticle::before, #reticle::after {
    content:""; position:absolute; background: var(--accent);
  }
  #reticle::before { left:50%; top:50%; width:14px; height:2px; transform:translate(-50%,-50%); }
  #reticle::after  { left:50%; top:50%; width:2px; height:14px; transform:translate(-50%,-50%); }
  /* guide lines that show locked axis */
  #guideV, #guideH {
    position: absolute; background: rgba(255,210,63,0.35); display: none;
  }
  #guideV { top: 0; bottom: 0; width: 2px; }
  #guideH { left: 0; right: 0; height: 2px; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    padding: 10px 14px 14px;
    display: flex; flex-direction: column; align-items: stretch; gap: 5px;
    background: linear-gradient(180deg, rgba(5,13,24,0.9), transparent);
  }
  #scoreboard {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  #scoreboard .team { display: flex; align-items: center; gap: 8px; }
  #scoreboard .tlabel { font-size: 13px; opacity: 0.92; max-width: 96px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scoreboard .tgoals { font-size: 26px; color: var(--accent); min-width: 22px; text-align: center; }
  #scoreboard .vs { opacity: 0.55; font-size: 18px; }
  #roundInfo { text-align: center; font-size: 13px; opacity: 0.9; letter-spacing: 0.5px; }
  .tracks { display: flex; justify-content: center; gap: 18px; }
  .track { display: flex; align-items: center; gap: 6px; }
  .track .tk { font-size: 14px; }
  .shots { display: flex; gap: 5px; }
  .shot-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.45);
    transition: transform .25s, background .25s;
  }
  .shot-dot.goal { background: var(--good); border-color: #fff; box-shadow: 0 0 9px var(--good); transform: scale(1.12); }
  .shot-dot.miss { background: var(--bad); border-color: #fff; }

  /* ---------- Controls / Banner ---------- */
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 12;
    padding: 16px 16px 22px;
    background: linear-gradient(0deg, rgba(5,13,24,0.92), transparent);
    text-align: center;
  }
  .hint { font-size: 13px; opacity: 0.9; margin-bottom: 10px; min-height: 18px; }

  .btn {
    appearance: none; border: none; cursor: pointer;
    font-family: inherit; font-weight: 900; font-size: 17px;
    color: var(--ink);
    background: linear-gradient(180deg, var(--accent), #ffb703);
    padding: 14px 22px; border-radius: 14px;
    box-shadow: 0 5px 0 #c98f00, 0 8px 18px rgba(0,0,0,0.4);
    transition: transform .08s, box-shadow .08s;
    width: 100%;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c98f00, 0 4px 10px rgba(0,0,0,0.4); }
  .btn.secondary {
    background: linear-gradient(180deg,#3a5a8c,#27406b); color:#fff;
    box-shadow: 0 5px 0 #16294a, 0 8px 18px rgba(0,0,0,0.4);
  }
  .btn.secondary:active { box-shadow: 0 1px 0 #16294a; }

  /* Power meter */
  #powerWrap {
    position: absolute; right: 14px; bottom: 120px; z-index: 11;
    width: 26px; height: 160px;
    background: rgba(5,13,24,0.6); border-radius: 14px; padding: 5px;
    border: 2px solid rgba(255,255,255,0.2);
    display: none;
  }
  #powerTrack { position: relative; width: 100%; height: 100%; border-radius: 9px; overflow: hidden;
    background: linear-gradient(0deg, var(--good) 0%, var(--accent) 50%, var(--bad) 100%); opacity: .35; }
  #powerFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(0deg, var(--good), var(--accent), var(--bad)); }
  #powerWrap .pw-label { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; opacity:.8; white-space:nowrap;}

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(5, 11, 22, 0.86);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 26px; text-align: center;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 40px; font-weight: 900; line-height: 1.05;
    background: linear-gradient(180deg,#fff,var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    margin-bottom: 4px;
  }
  .subtitle { font-size: 15px; opacity: 0.8; margin-bottom: 22px; letter-spacing: 1px; }
  .ball-icon { font-size: 54px; margin-bottom: 8px; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .field { width: 100%; max-width: 280px; margin-bottom: 14px; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 16px; font-family: inherit; text-align: center;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }

  .btnrow { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; }

  .result-num { font-size: 72px; font-weight: 900; color: var(--accent); line-height: 1; margin: 6px 0; }
  .result-line { font-size: 16px; opacity: 0.9; margin-bottom: 4px; }
  .result-big { font-size: 52px; font-weight: 900; line-height: 1; margin-bottom: 6px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
  .result-big.win  { color: var(--good); text-shadow: 0 0 26px rgba(33,208,122,0.6); }
  .result-big.lose { color: var(--bad); }
  .result-big.draw { color: #cdd3dc; }
  .result-score { font-size: 24px; font-weight: 900; margin: 8px 0 4px; opacity: 0.95; }
  .result-score b { color: var(--accent); font-size: 30px; }
  .res { font-size: 12px; font-weight: 900; padding: 2px 9px; border-radius: 10px; }
  .res.win  { background: var(--good); color: #04331d; }
  .res.lose { background: var(--bad); color: #fff; }
  .res.draw { background: #5a6b82; color: #fff; }
  .new-record {
    display: inline-block; margin: 10px 0; padding: 6px 16px; border-radius: 20px;
    background: var(--accent-2); font-weight: 900; font-size: 14px; letter-spacing: 1px;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.08);} }

  /* Leaderboard */
  .board {
    width: 100%; max-width: 300px; margin: 8px 0 20px;
    background: rgba(255,255,255,0.06); border-radius: 14px; padding: 8px;
    max-height: 230px; overflow-y: auto;
  }
  .board h3 { font-size: 14px; opacity: 0.7; letter-spacing: 2px; margin: 6px 0 10px; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.04);
    font-size: 15px;
  }
  .row.me { background: rgba(255,210,63,0.18); border: 1px solid var(--accent); }
  .rank { width: 26px; font-weight: 900; opacity: 0.9; text-align:center; }
  .rank.r1 { color: #ffd23f; } .rank.r2 { color: #cdd3dc; } .rank.r3 { color: #e0995a; }
  .rname { flex: 1; text-align: left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rscore { font-weight: 900; color: var(--accent); }
  .empty-board { opacity: 0.5; font-size: 14px; padding: 16px; }

  /* Flash text mid-game */
  #flash {
    position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%) scale(0.6);
    z-index: 15; font-size: 56px; font-weight: 900; opacity: 0;
    text-shadow: 0 6px 16px rgba(0,0,0,0.6); pointer-events: none; white-space: nowrap;
  }
  #flash.show { animation: flashpop 1.1s ease-out forwards; }
  @keyframes flashpop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5) rotate(-6deg); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(2deg); }
    70% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(-50%,-58%) scale(1); }
  }
</style>
</head>
<body>
<div id="stage">

  <!-- Pitch -->
  <div id="pitch">
    <div class="sky"></div>
    <div class="floodlight l"></div>
    <div class="floodlight r"></div>
    <div class="crowd"></div>
    <div class="grass">
      <div class="penalty-arc"></div>
    </div>
  </div>

  <!-- Goal + keeper -->
  <div id="goalWrap">
    <div class="net"></div>
    <div id="keeperLayer">
      <div class="gk-ground-shadow"></div>
      <div id="keeper">
        <svg viewBox="0 0 90 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f7cfa3"/><stop offset="1" stop-color="#d99a68"/>
            </linearGradient>
            <linearGradient id="kitG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#23dab2"/><stop offset="1" stop-color="#0b8067"/>
            </linearGradient>
            <linearGradient id="shortG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2e4066"/><stop offset="1" stop-color="#131f37"/>
            </linearGradient>
            <radialGradient id="gloveG" cx="0.35" cy="0.3" r="0.85">
              <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ccd6e2"/>
            </radialGradient>
            <linearGradient id="bootG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff7a50"/><stop offset="1" stop-color="#cf3a1a"/>
            </linearGradient>
            <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3c2c1e"/><stop offset="1" stop-color="#1a1009"/>
            </linearGradient>
          </defs>

          <!-- legs (socks) -->
          <path d="M41 96 L37 128 L34 152" stroke="url(#kitG)" stroke-width="13" fill="none" stroke-linecap="round"/>
          <path d="M49 96 L53 128 L56 152" stroke="url(#kitG)" stroke-width="13" fill="none" stroke-linecap="round"/>
          <!-- boots -->
          <ellipse cx="31" cy="153" rx="11.5" ry="6" fill="url(#bootG)"/>
          <ellipse cx="59" cy="153" rx="11.5" ry="6" fill="url(#bootG)"/>
          <!-- shorts -->
          <path d="M30 85 Q45 79 60 85 L58 112 Q45 116 32 112 Z" fill="url(#shortG)"/>
          <line x1="45" y1="90" x2="45" y2="113" stroke="rgba(0,0,0,0.28)" stroke-width="2.5"/>

          <!-- arms (sleeves) -->
          <g class="arm arm-l">
            <path d="M33 54 L24 74 L21 93" stroke="url(#kitG)" stroke-width="11" fill="none" stroke-linecap="round"/>
            <rect class="gk-glove" id="gloveL" x="13.5" y="86" width="16" height="19" rx="6" fill="url(#gloveG)" stroke="#0b8067" stroke-width="2"/>
            <line x1="18" y1="89" x2="18" y2="101" stroke="rgba(0,0,0,0.18)" stroke-width="1.4"/>
            <line x1="22" y1="89" x2="22" y2="101" stroke="rgba(0,0,0,0.18)" stroke-width="1.4"/>
            <line x1="26" y1="89" x2="26" y2="101" stroke="rgba(0,0,0,0.18)" stroke-width="1.4"/>
          </g>
          <g class="arm arm-r">
            <path d="M57 54 L66 74 L69 93" stroke="url(#kitG)" stroke-width="11" fill="none" stroke-linecap="round"/>
            <rect class="gk-glove" id="gloveR" x="60.5" y="86" width="16" height="19" rx="6" fill="url(#gloveG)" stroke="#0b8067" stroke-width="2"/>
            <line x1="64" y1="89" x2="64" y2="101" stroke="rgba(0,0,0,0.18)" stroke-width="1.4"/>
            <line x1="68" y1="89" x2="68" y2="101" stroke="rgba(0,0,0,0.18)" stroke-width="1.4"/>
            <line x1="72" y1="89" x2="72" y2="101" stroke="rgba(0,0,0,0.18)" stroke-width="1.4"/>
          </g>

          <!-- torso (jersey) -->
          <path d="M31 50 Q45 43 59 50 L57 91 Q45 97 33 91 Z" fill="url(#kitG)"/>
          <path d="M45 46 L57 50 L57 91 Q51 95 45 96 Z" fill="rgba(0,0,0,0.13)"/>
          <path d="M31 50 Q45 43 59 50 L58 59 Q45 53 32 59 Z" fill="#0a6b55"/>
          <text x="45" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="rgba(255,255,255,0.92)" font-family="Arial, sans-serif">1</text>

          <!-- neck -->
          <rect x="41" y="36" width="8" height="13" rx="3.5" fill="url(#skinG)"/>
          <!-- ears -->
          <ellipse cx="33.5" cy="27" rx="2.6" ry="3.4" fill="url(#skinG)"/>
          <ellipse cx="56.5" cy="27" rx="2.6" ry="3.4" fill="url(#skinG)"/>
          <!-- head -->
          <ellipse cx="45" cy="26" rx="12.5" ry="14" fill="url(#skinG)"/>
          <!-- hair -->
          <path d="M32 24 Q31 9 45 8 Q59 9 58 24 Q53 15 45 15 Q37 15 32 24 Z" fill="url(#hairG)"/>
          <!-- face -->
          <ellipse cx="40.5" cy="27" rx="1.7" ry="2.3" fill="#33271c"/>
          <ellipse cx="49.5" cy="27" rx="1.7" ry="2.3" fill="#33271c"/>
          <path d="M37.5 22.5 Q40.5 21 43 22.5" stroke="#3c2c1e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M47 22.5 Q49.5 21 52.5 22.5" stroke="#3c2c1e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M41.5 32 Q45 34 48.5 32" stroke="#b5703f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Aim -->
  <div id="aimZone">
    <div id="guideV"></div>
    <div id="guideH"></div>
    <div id="reticle"></div>
  </div>

  <!-- Ball -->
  <div id="ballShadow"></div>
  <div id="ball"><div class="ball-skin"></div></div>

  <!-- Power meter -->
  <div id="powerWrap">
    <div id="powerTrack"></div>
    <div id="powerFill"></div>
    <span class="pw-label">파워</span>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="scoreboard">
      <div class="team"><span class="tlabel" id="meLabel">나</span><span class="tgoals" id="myGoals">0</span></div>
      <span class="vs">:</span>
      <div class="team"><span class="tgoals" id="oppGoals">0</span><span class="tlabel">컴퓨터</span></div>
    </div>
    <div id="roundInfo">공격 1 / 5</div>
    <div class="tracks">
      <div class="track"><span class="tk">🥅</span><div class="shots" id="atkDots"></div></div>
      <div class="track"><span class="tk">🧤</span><div class="shots" id="defDots"></div></div>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div class="hint" id="hint"></div>
    <button class="btn" id="actionBtn">조준</button>
  </div>

  <!-- Flash -->
  <div id="flash"></div>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <div class="ball-icon">⚽</div>
    <div class="title">ALEX<br>SOCCER</div>
    <div class="subtitle">공격 5번 + 수비 5번, 컴퓨터와 승부!</div>
    <div class="field">
      <input id="nameInput" maxlength="12" placeholder="이름을 입력하세요" />
    </div>
    <div class="btnrow">
      <button class="btn" id="startBtn">킥오프 ⚽</button>
      <button class="btn secondary" id="boardBtn">🏆 랭킹 보기</button>
    </div>
  </div>

  <!-- Result overlay -->
  <div class="overlay hidden" id="resultOverlay">
    <div class="result-big" id="resultBig">WIN!</div>
    <div class="result-line" id="resultTitle">경기 종료!</div>
    <div class="result-score" id="resultScore">나 0 : 0 컴퓨터</div>
    <div id="recordBadge"></div>
    <div class="board" id="resultBoard"></div>
    <div class="btnrow">
      <button class="btn" id="againBtn">다시 하기 🔁</button>
      <button class="btn secondary" id="homeBtn">처음으로</button>
    </div>
  </div>

  <!-- Board overlay -->
  <div class="overlay hidden" id="boardOverlay">
    <div class="title" style="font-size:30px;">🏆 명예의 전당</div>
    <div class="subtitle">승패 · 최고 기록 랭킹</div>
    <div class="board" id="boardList"></div>
    <div class="btnrow">
      <button class="btn secondary" id="boardBackBtn">← 돌아가기</button>
      <button class="btn secondary" id="clearBtn" style="font-size:13px;background:linear-gradient(180deg,#7a2a36,#5a1a24);box-shadow:0 5px 0 #3a0f16;">기록 초기화</button>
    </div>
  </div>

</div>

<script>
(() => {
  "use strict";

  // ---------- Elements ----------
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const ball = $("ball"), ballShadow = $("ballShadow"), ballSkin = ball.firstElementChild;
  const keeper = $("keeper");
  const reticle = $("reticle"), aimZone = $("aimZone");
  const guideV = $("guideV"), guideH = $("guideH");
  const powerWrap = $("powerWrap"), powerFill = $("powerFill");
  const actionBtn = $("actionBtn"), hint = $("hint");
  const atkDots = $("atkDots"), defDots = $("defDots");
  const flash = $("flash");
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const STORAGE_KEY = "penaltyShooters.leaderboard.v1";
  const BLOB_URL = "https://jsonblob.com/api/jsonBlob/019e8d6e-bd07-782a-86b3-acb8215c0a68";
  const TOTAL_KICKS = 5;

  // ---------- Game state ----------
  let state = "idle";   // idle | aimX | aimY | power | saveX | saveY | busy | done
  let half = "attack";  // attack (you kick) | defense (you save)
  let idx = 0;          // shot index within the current half (0..4)
  let myGoals = 0, oppGoals = 0;
  let playerName = "플레이어";
  let aimX = 0, aimY = 0.5, power = 0;     // attack aim
  let saveX = 0, saveY = 0.5;              // defense dive target
  let oscPos = 0, oscDir = 1;              // generic oscillator
  let raf = null;

  // ---------- Leaderboard (shared online + local fallback) ----------
  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveLocal(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }
  // Each entry: {name, my, opp?, date}. Legacy entries may have {name, score}.
  function rankTuple(e) {
    const my = (e.my != null) ? +e.my : (+e.score || 0);
    const opp = (e.opp != null) ? +e.opp : null;
    const r = (opp == null) ? 1 : (my > opp ? 2 : (my === opp ? 1 : 0)); // win2 draw1 lose0
    return { my, opp, r };
  }
  function cmpEntries(a, b) {            // > 0 when a is the better record
    const A = rankTuple(a), B = rankTuple(b);
    if (A.r !== B.r) return A.r - B.r;
    if (A.my !== B.my) return A.my - B.my;
    const ao = A.opp == null ? 99 : A.opp, bo = B.opp == null ? 99 : B.opp;
    if (ao !== bo) return bo - ao;        // fewer goals conceded is better
    return (+b.date || 0) - (+a.date || 0); // older record wins ties
  }
  function normalizeEntry(e) {
    const my = (e.my != null) ? +e.my : (+e.score || 0);
    const opp = (e.opp != null) ? +e.opp : null;
    const o = { name: e.name, my, date: +e.date || Date.now() };
    if (opp != null) o.opp = opp;
    return o;
  }
  function resLabel(t) { return t.r === 2 ? "승" : t.r === 1 ? "무" : "패"; }
  // Merge score arrays into one best record per name.
  function mergeScores(...lists) {
    const best = new Map();
    lists.flat().forEach((e) => {
      if (!e || typeof e.name !== "string") return;
      const cur = best.get(e.name);
      if (!cur || cmpEntries(e, cur) > 0) best.set(e.name, normalizeEntry(e));
    });
    return [...best.values()].sort((a, b) => cmpEntries(b, a));
  }
  async function fetchRemote() {
    try {
      const res = await fetch(BLOB_URL, { headers: { "Accept": "application/json" } });
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data.scores) ? data.scores : [];
    } catch (e) { return null; }
  }
  async function pushRemote(list) {
    try {
      const res = await fetch(BLOB_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ scores: list }),
      });
      return res.ok;
    } catch (e) { return false; }
  }
  // Pull remote, merge with local, save & push the union. Returns {list, online}.
  async function syncBoard() {
    const local = loadLocal();
    const remote = await fetchRemote();
    if (remote === null) return { list: mergeScores(local), online: false };
    const merged = mergeScores(remote, local);
    saveLocal(merged);
    const changed = JSON.stringify(merged) !== JSON.stringify(mergeScores(remote));
    if (changed) await pushRemote(merged);
    return { list: merged, online: true };
  }
  // Submit a finished match; returns {list, isRecord, prevText, online}.
  async function submitScore(name, my, opp) {
    const remote = await fetchRemote();
    const local = loadLocal();
    const entry = { name, my, opp, date: Date.now() };
    const prev = mergeScores(remote || [], local).find(e => e.name === name);
    const isRecord = !prev || cmpEntries(entry, prev) > 0;
    let prevText = "";
    if (prev) {
      const t = rankTuple(prev);
      prevText = (t.opp == null) ? `${t.my}골` : `${t.my} : ${t.opp} (${resLabel(t)})`;
    }
    const merged = mergeScores(remote || [], local, [entry]);
    saveLocal(merged);
    const online = (remote !== null) ? await pushRemote(merged) : false;
    return { list: merged, isRecord, prevText, online };
  }
  function loadingBoard(container) {
    container.innerHTML = '<div class="empty-board">랭킹 불러오는 중…</div>';
  }
  function renderBoard(container, highlight, list) {
    if (!list || !list.length) { container.innerHTML = '<div class="empty-board">아직 기록이 없어요.<br>첫 번째 도전자가 되어보세요!</div>'; return; }
    let html = '<h3>RANKING</h3>';
    list.slice(0, 20).forEach((e, i) => {
      const t = rankTuple(e);
      const me = (e.name === highlight) ? " me" : "";
      const rcls = i < 3 ? " r" + (i + 1) : "";
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
      let badge = "", scoreText;
      if (t.opp == null) { scoreText = `${t.my}골`; }
      else {
        const res = t.r === 2 ? "win" : t.r === 1 ? "draw" : "lose";
        badge = `<span class="res ${res}">${resLabel(t)}</span>`;
        scoreText = `${t.my} : ${t.opp}`;
      }
      html += `<div class="row${me}">
        <span class="rank${rcls}">${medal}</span>
        <span class="rname">${escapeHtml(e.name)}</span>
        ${badge}<span class="rscore">${scoreText}</span>
      </div>`;
    });
    container.innerHTML = html;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- HUD ----------
  function buildTracks() {
    [atkDots, defDots].forEach((tr) => {
      tr.innerHTML = "";
      for (let i = 0; i < TOTAL_KICKS; i++) {
        const d = document.createElement("div");
        d.className = "shot-dot";
        tr.appendChild(d);
      }
    });
  }
  function markDot(tr, i, good) {
    const d = tr.children[i];
    if (d) d.classList.add(good ? "goal" : "miss");
  }
  function updateScore() {
    $("myGoals").textContent = myGoals;
    $("oppGoals").textContent = oppGoals;
  }

  // ---------- Geometry ----------
  // Map normalized aim to a position inside the goal (percentages of aimZone).
  function aimToPct(ax, ay) {
    return { leftPct: 50 + ax * 43, topPct: 78 - ay * 64 };
  }
  // Convert aim to a point in stage pixels (for save detection & flight).
  function aimToStagePx(ax, ay) {
    const z = aimZone.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    const p = aimToPct(ax, ay);
    return {
      x: (z.left - s.left) + z.width  * (p.leftPct / 100),
      y: (z.top  - s.top ) + z.height * (p.topPct  / 100),
      sw: s.width, sh: s.height, gw: z.width, gh: z.height,
    };
  }

  function placeReticle(ax, ay) {
    const p = aimToPct(ax, ay);
    reticle.style.left = p.leftPct + "%";
    reticle.style.top  = p.topPct  + "%";
  }

  // ---------- Oscillating aim ----------
  function runOscillator(onUpdate) {
    cancelAnimationFrame(raf);
    const loop = () => {
      oscPos += oscDir * 0.024;
      if (oscPos > 1) { oscPos = 1; oscDir = -1; }
      if (oscPos < -1) { oscPos = -1; oscDir = 1; }
      onUpdate(oscPos);
      raf = requestAnimationFrame(loop);
    };
    loop();
  }

  // ---------- Flow: aiming ----------
  function startAimX() {
    state = "aimX";
    reticle.style.display = "block";
    guideV.style.display = "none"; guideH.style.display = "none";
    actionBtn.textContent = "좌우 고정 ◀▶";
    hint.textContent = "좌우로 움직이는 조준점 — 원하는 가로 위치에서 누르세요";
    oscPos = (Math.random() * 1.4 - 0.7); oscDir = 1;
    aimY = 0.5;
    runOscillator((v) => placeReticle(v, aimY));
  }

  function lockAimX() {
    cancelAnimationFrame(raf);
    aimX = oscPos;
    // show vertical guide at chosen X
    const p = aimToPct(aimX, aimY);
    guideV.style.left = p.leftPct + "%"; guideV.style.display = "block";
    state = "aimY";
    actionBtn.textContent = "상하 고정 ▲▼";
    hint.textContent = "이번엔 위아래! 높이를 정해서 누르세요 (위 = 구석 높이)";
    oscPos = 0; oscDir = 1;
    runOscillator((v) => {
      aimY = (v + 1) / 2;            // 0..1
      placeReticle(aimX, aimY);
    });
  }

  function lockAimY() {
    cancelAnimationFrame(raf);
    // aimY already set by oscillator
    const p = aimToPct(aimX, aimY);
    guideH.style.top = p.topPct + "%"; guideH.style.display = "block";
    state = "power";
    powerWrap.style.display = "block";
    actionBtn.textContent = "슛! ⚽";
    hint.textContent = "파워가 셀수록 강하지만, 너무 세면 빗나가요";
    oscPos = -1; oscDir = 1;
    runOscillator((v) => {
      power = (v + 1) / 2;          // 0..1
      powerFill.style.height = (power * 100) + "%";
    });
  }

  // ---------- Attack: you shoot ----------
  function shootAttack() {
    cancelAnimationFrame(raf);
    state = "busy";
    hideAimUI();
    actionBtn.textContent = "…"; actionBtn.disabled = true;
    hint.textContent = "";

    const swayX = (Math.random() * 2 - 1) * power * 0.12;
    const swayY = (Math.random() * 2 - 1) * power * 0.10;
    const landX = clamp(aimX + swayX, -1.08, 1.08);
    const landY = clamp(aimY + swayY, -0.05, 1.12);
    const wide = Math.abs(landX) > 1.0, over = landY > 1.0;

    const gk = decideKeeper(aimX, aimY, idx);
    setTimeout(() => diveKeeper(gk.gx, gk.gy), 95);   // keeper reacts after the kick
    flyBall(landX, landY, wide, over, () => {
      const scored = (wide || over) ? false : !isCaught();
      resolveAttack(scored, wide || over);
    });
  }

  // Keeper guesses a 2D spot to dive toward. Skill rises each kick.
  // gx/gy are clamped so a perfectly placed top-corner can beat even a correct read.
  function decideKeeper(playerAimX, playerAimY, kickIdx) {
    const skill = 0.55 + kickIdx * 0.08;     // chance to read your aim (high)
    let gx, gy;
    if (Math.random() < skill) {
      gx = playerAimX + (Math.random() * 0.32 - 0.16);  // reads with small error
      gy = playerAimY + (Math.random() * 0.32 - 0.16);
    } else {
      // even a "wrong" guess leans toward the side you aimed at
      gx = playerAimX * 0.4 + (Math.random() * 1.6 - 0.8);
      gy = Math.random();
    }
    gx = Math.max(-0.92, Math.min(0.92, gx));
    gy = Math.max(0, Math.min(0.94, gy));
    return { gx, gy };
  }

  // Move the keeper as a real on-screen dive toward (gx, gy). Shared by AI & player.
  function diveKeeper(gx, gy) {
    const z = aimZone.getBoundingClientRect();
    const travelX = gx * z.width  * 0.50;
    const liftY   = gy * z.height * 0.58;
    const lean    = gx * 74;
    const stretch = 1 + Math.abs(gx) * 0.12;
    if (gx < -0.2) keeper.classList.add(gy > 0.55 ? "reach-up" : "reach-l");
    else if (gx > 0.2) keeper.classList.add(gy > 0.55 ? "reach-up" : "reach-r");
    else if (gy > 0.55) keeper.classList.add("reach-up");
    keeper.style.transform =
      `translate(${travelX}px, ${-liftY}px) rotate(${lean}deg) scale(${stretch})`;
  }

  // Animate the ball to (landX, landY); call onArrive once it (and the dive) settle.
  function flyBall(landX, landY, wide, over, onArrive) {
    const target = aimToStagePx(landX, landY);
    const finalLeftPct = wide ? (landX > 0 ? 97 : 3) : (target.x / target.sw) * 100;
    const finalBottomPct = over ? 80 : (1 - target.y / target.sh) * 100;

    const flightMs = 580;
    ball.style.transition = `left ${flightMs}ms cubic-bezier(.3,.05,.5,1), bottom ${flightMs}ms cubic-bezier(.25,.6,.4,1), transform ${flightMs}ms linear, width ${flightMs}ms, height ${flightMs}ms`;
    ballShadow.style.transition = `left ${flightMs}ms ease-out, bottom ${flightMs}ms ease-out, opacity ${flightMs}ms, width ${flightMs}ms`;
    ballSkin.style.transition = `transform ${flightMs}ms linear`;

    requestAnimationFrame(() => {
      ball.style.left = finalLeftPct + "%";
      ball.style.bottom = finalBottomPct + "%";
      ball.style.width = "22px"; ball.style.height = "22px";
      ballSkin.style.transform = `rotate(${landX * 720 + 540}deg)`;
      ballShadow.style.left = finalLeftPct + "%";
      ballShadow.style.bottom = (finalBottomPct - 3) + "%";
      ballShadow.style.width = "20px";
      ballShadow.style.opacity = "0.25";
    });

    setTimeout(onArrive, flightMs + 20);
  }

  // WYSIWYG save check: measure where the gloves and ball actually are on screen.
  function isCaught() {
    const b = ball.getBoundingClientRect();
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let nearest = Infinity, gloveW = 16;
    ["gloveL", "gloveR"].forEach((id) => {
      const g = $(id).getBoundingClientRect();
      gloveW = g.width || gloveW;
      const d = Math.hypot(bx - (g.left + g.width / 2), by - (g.top + g.height / 2));
      if (d < nearest) nearest = d;
    });
    const reach = gloveW * 1.35 + 34;   // glove + extended-arm dive span
    return nearest <= reach;
  }

  function resolveAttack(scored, missedNet) {
    state = "done";
    if (scored) { myGoals++; updateScore(); showFlash("⚽ 골인!", "var(--good)"); keeperFlash(); }
    else if (missedNet) showFlash("빗나감!", "var(--bad)");
    else showFlash("막혔다!", "var(--bad)");
    markDot(atkDots, idx, scored);
    idx++;
    setTimeout(() => { (idx >= TOTAL_KICKS) ? startDefensePhase() : (resetForNext(), beginAttackTurn()); }, 1300);
  }

  // ---------- Defense: you save ----------
  function startSaveX() {
    state = "saveX"; reticle.style.display = "block";
    guideV.style.display = "none"; guideH.style.display = "none";
    actionBtn.textContent = "좌우 고정 ◀▶";
    hint.textContent = "상대 슛 방향을 예측! 막을 가로 위치를 정하세요";
    oscPos = (Math.random() * 1.4 - 0.7); oscDir = 1; saveY = 0.5;
    runOscillator((v) => placeReticle(v, saveY));
  }
  function lockSaveX() {
    cancelAnimationFrame(raf); saveX = oscPos;
    const p = aimToPct(saveX, saveY);
    guideV.style.left = p.leftPct + "%"; guideV.style.display = "block";
    state = "saveY"; actionBtn.textContent = "막기! 🧤";
    hint.textContent = "막을 높이를 정하고 누르세요";
    oscPos = 0; oscDir = 1;
    runOscillator((v) => { saveY = (v + 1) / 2; placeReticle(saveX, saveY); });
  }
  function lockSaveY() {
    cancelAnimationFrame(raf);
    state = "busy"; hideAimUI();
    actionBtn.textContent = "…"; actionBtn.disabled = true; hint.textContent = "";
    diveKeeper(clamp(saveX, -0.98, 0.98), clamp(saveY, 0, 0.98));   // you committed your dive
    const shot = decideKicker(idx);
    flyBall(shot.x, shot.y, shot.wide, shot.over, () => {
      const conceded = (shot.wide || shot.over) ? false : !isCaught();
      resolveDefense(conceded, shot.wide || shot.over);
    });
  }
  // Computer kicker picks where to shoot.
  function decideKicker(i) {
    if (Math.random() < 0.12) {                 // opponent misses the net
      return (Math.random() < 0.5)
        ? { x: (Math.random() < 0.5 ? -1.15 : 1.15), y: 0.5, wide: true, over: false }
        : { x: (Math.random() * 1.4 - 0.7), y: 1.15, wide: false, over: true };
    }
    let x, y;
    if (Math.random() < 0.62) {                 // aim a corner
      x = (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.5);
      y = 0.35 + Math.random() * 0.55;
    } else {                                    // central / low
      x = Math.random() * 0.7 - 0.35;
      y = Math.random() * 0.55;
    }
    return { x: clamp(x, -0.98, 0.98), y: clamp(y, 0, 0.98), wide: false, over: false };
  }
  function resolveDefense(conceded, missedNet) {
    state = "done";
    if (conceded) { oppGoals++; updateScore(); showFlash("실점…", "var(--bad)"); }
    else if (missedNet) showFlash("상대 실축!", "var(--good)");
    else { showFlash("🧤 선방!", "var(--good)"); keeperFlash(); }
    markDot(defDots, idx, !conceded);
    idx++;
    setTimeout(() => { (idx >= TOTAL_KICKS) ? endGame() : (resetForNext(), beginDefenseTurn()); }, 1300);
  }

  // ---------- Turn / phase ----------
  function beginAttackTurn() {
    half = "attack"; state = "idle";
    $("roundInfo").textContent = `🥅 공격 ${idx + 1} / ${TOTAL_KICKS}`;
    actionBtn.disabled = false; actionBtn.textContent = "조준 ◎";
    hint.textContent = "내 차례! [조준]을 눌러 골대 빈 곳을 노려요";
  }
  function beginDefenseTurn() {
    half = "defense"; state = "idle";
    $("roundInfo").textContent = `🧤 수비 ${idx + 1} / ${TOTAL_KICKS}`;
    actionBtn.disabled = false; actionBtn.textContent = "막기 위치 ◎";
    hint.textContent = "상대 슛이 올 곳을 예측! [막기 위치]를 눌러요";
  }
  function startDefensePhase() {
    idx = 0; resetForNext();
    showFlash("🧤 후반 · 수비!", "var(--accent)");
    beginDefenseTurn();
  }
  function keeperFlash() {
    keeper.animate([{ filter: "brightness(1)" }, { filter: "brightness(1.5)" }, { filter: "brightness(1)" }], { duration: 300 });
  }

  function showFlash(text, color) {
    flash.textContent = text;
    flash.style.color = "#fff";
    flash.style.textShadow = `0 0 18px ${color}, 0 6px 16px rgba(0,0,0,0.6)`;
    flash.classList.remove("show"); void flash.offsetWidth; flash.classList.add("show");
  }

  function hideAimUI() {
    reticle.style.display = "none";
    guideV.style.display = "none"; guideH.style.display = "none";
    powerWrap.style.display = "none"; powerFill.style.height = "0%";
  }
  function resetForNext() {
    ball.style.transition = "none"; ballShadow.style.transition = "none";
    keeper.className = ""; keeper.style.transform = "";
    ball.style.left = "50%"; ball.style.bottom = "14%";
    ball.style.width = "38px"; ball.style.height = "38px";
    ballSkin.style.transition = "none"; ballSkin.style.transform = "rotate(0deg)";
    ballShadow.style.left = "50%"; ballShadow.style.bottom = "12%";
    ballShadow.style.width = "40px"; ballShadow.style.opacity = "1";
    hideAimUI();
    actionBtn.disabled = false;
    state = "idle";
  }

  // ---------- Game flow ----------
  function startGame() {
    const nm = $("nameInput").value.trim();
    playerName = nm || "플레이어";
    $("meLabel").textContent = playerName;
    myGoals = 0; oppGoals = 0; updateScore();
    idx = 0; half = "attack";
    buildTracks();
    $("startOverlay").classList.add("hidden");
    $("resultOverlay").classList.add("hidden");
    resetForNext();
    showFlash("전반 · 공격!", "var(--accent)");
    beginAttackTurn();
  }

  async function endGame() {
    state = "done";
    const result = myGoals > oppGoals ? "win" : (myGoals < oppGoals ? "lose" : "draw");
    const big = $("resultBig");
    big.className = "result-big " + result;
    big.textContent = result === "win" ? "WIN! 🏆" : result === "lose" ? "LOSE 😢" : "DRAW 🤝";
    $("resultTitle").textContent = result === "win" ? "이겼어요! 멋져요 👏"
      : result === "lose" ? "아쉽게 졌어요" : "막상막하 무승부!";
    $("resultScore").innerHTML = `${escapeHtml(playerName)} <b>${myGoals}</b> : <b>${oppGoals}</b> 컴퓨터`;
    $("recordBadge").innerHTML = "";
    loadingBoard($("resultBoard"));
    $("resultOverlay").classList.remove("hidden");

    const { list, isRecord, prevText, online } = await submitScore(playerName, myGoals, oppGoals);
    $("recordBadge").innerHTML = isRecord
      ? '<span class="new-record">🎉 자기 최고 기록 경신!</span>'
      : `<div class="result-line" style="opacity:.6">내 최고 기록: ${prevText}</div>`;
    renderBoard($("resultBoard"), playerName, list);
    if (!online) {
      $("resultBoard").insertAdjacentHTML("afterbegin",
        '<div class="empty-board" style="padding:8px;color:#ffd23f">⚠️ 오프라인 — 인터넷 연결 시 공용 랭킹에 반영돼요</div>');
    }
  }

  // ---------- Action button ----------
  function onAction() {
    if (state === "idle") { half === "attack" ? startAimX() : startSaveX(); }
    else if (state === "aimX") lockAimX();
    else if (state === "aimY") lockAimY();
    else if (state === "power") shootAttack();
    else if (state === "saveX") lockSaveX();
    else if (state === "saveY") lockSaveY();
  }

  // ---------- Wire up ----------
  actionBtn.addEventListener("click", onAction);
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") {
      if (!$("startOverlay").classList.contains("hidden")) return;
      if (!$("resultOverlay").classList.contains("hidden")) return;
      if (!$("boardOverlay").classList.contains("hidden")) return;
      e.preventDefault(); onAction();
    }
  });

  $("startBtn").addEventListener("click", startGame);
  $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });
  $("againBtn").addEventListener("click", startGame);
  $("homeBtn").addEventListener("click", () => {
    $("resultOverlay").classList.add("hidden");
    $("startOverlay").classList.remove("hidden");
  });
  $("boardBtn").addEventListener("click", async () => {
    $("boardOverlay").classList.remove("hidden");
    loadingBoard($("boardList"));
    const { list, online } = await syncBoard();
    renderBoard($("boardList"), $("nameInput").value.trim(), list);
    if (!online) $("boardList").insertAdjacentHTML("afterbegin",
      '<div class="empty-board" style="padding:8px;color:#ffd23f">⚠️ 오프라인 — 이 기기 기록만 표시 중</div>');
  });
  $("boardBackBtn").addEventListener("click", () => $("boardOverlay").classList.add("hidden"));
  $("clearBtn").addEventListener("click", async () => {
    if (confirm("공용 랭킹의 모든 기록을 지웁니다.\n친구들 기록까지 전부 삭제돼요. 계속할까요?")) {
      saveLocal([]);
      await pushRemote([]);
      renderBoard($("boardList"), playerName, []);
    }
  });

  // init
  buildTracks();
  $("nameInput").focus();
})();
</script>
</body>
</html>
